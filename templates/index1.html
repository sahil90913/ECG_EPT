<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECG GPT</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #003366;
            color: white;
        }

        nav {
            width: 100%;
            background-color: #002244;
            padding: 10px 0;
            position: fixed;
            top: 0;
            left: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        nav .left-links, nav .right-links {
            display: flex;
            align-items: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-size: 18px;
            font-weight: bold;
            padding: 10px 20px;
            background-color: #007BFF;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }

        nav a:hover {
            background-color: #0056b3;
        }

        .dropdown {
            position: relative;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: #002244;
            top: 50px;
            min-width: 250px;
            border-radius: 5px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
            z-index: 1000;
        }

        .dropdown-content a {
            display: block;
            padding: 12px 16px;
            text-decoration: none;
            color: white;
        }

        .dropdown-content a:hover {
            background-color: #007BFF;
        }

        .welcome-text {
            font-size: 108px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 40px;
            margin-top: 80px;
        }

        .upload-container {
            padding: 20px;
            border: 2px solid #333;
            border-radius: 10px;
            background-color: white;
            color: #333;
            text-align: center;
        }

        input[type="file"] {
            margin-top: 10px;
        }

        button {
            margin-top: 10px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
        }

        button:hover {
            background-color: #0056b3;
        }

        .user-info {
            margin-top: 40px;
            text-align: center;
        }

        .user-info input {
            padding: 10px;
            font-size: 16px;
            margin: 5px;
            border: 1px solid #333;
            border-radius: 5px;
        }

        .form-popup {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 20px;
            border: 2px solid #333;
            border-radius: 10px;
            background-color: white;
            color: #333;
            text-align: center;
            width: 300px;
            z-index: 1000;
        }

        .form-popup h1 {
            margin-bottom: 20px;
        }

        .form-popup input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #333;
            border-radius: 5px;
        }

        .form-popup button {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            cursor: pointer;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            margin-top: 10px;
        }

        .form-popup button:hover {
            background-color: #0056b3;
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 999;
        }
    </style>
</head>
<body>

<!-- Navigation Bar -->
<nav>
    <div class="left-links">
        <a href="#">Home</a>

        <div class="dropdown">
            <a href="javascript:void(0)" onclick="toggleDropdown()">Services</a>
            <div id="dropdown-content" class="dropdown-content">
                <a href="#">AI-Powered ECG Interpretation</a>
                <a href="#">Customizable Report Generation</a>
                <a href="#">Subscription Plan</a>
            </div>
        </div>

        <a href="#">Instruction</a>
        <a href="#">Contact Us</a>
    </div>
    <div class="right-links">
        <a href="#" onclick="openForm('login')">Login</a>
        <a href="#" onclick="openForm('register')">Register</a>
    </div>
</nav>

<!-- Welcome Section -->
<div class="welcome-text">Welcome to ECG GPT</div>

<!-- Upload Section -->
<div class="upload-container">
    <h1>Upload ECG Image for Analysis</h1>
    <form action="/" method="post" enctype="multipart/form-data">
        <input type="file" name="file" required>
        <br>
        <button type="submit">Upload and Analyze</button>
    </form>
</div>

<!-- Optional User Info Section -->
<div class="user-info">
    <h2>Optional Information</h2>
    <input type="text" placeholder="Enter your name">
    <input type="number" placeholder="Enter your age">
</div>

<!-- Login Form -->
<div id="loginForm" class="form-popup">
    <h1>Login</h1>
    <form method="post" action="/login">
        <input type="email" name="email" placeholder="Enter your email" required>
        <input type="password" name="password" placeholder="Enter your password" required>
        <button type="submit">Login</button>
        <button type="button" onclick="closeForm()">Close</button>
    </form>
</div>

<!-- Register Form -->
<div id="registerForm" class="form-popup">
    <h1>Register</h1>
    <form method="post" action="/register">
        <input type="text" name="name" placeholder="Enter your name" required>
        <input type="email" name="email" placeholder="Enter your email" required>
        <input type="password" name="password" placeholder="Create a password" required>
        <button type="submit">Register</button>
        <button type="button" onclick="closeForm()">Close</button>
    </form>
</div>

<!-- Overlay -->
<div id="overlay" class="overlay"></div>

<script>
    // Form popup controls
    function openForm(formType) {
        document.getElementById('overlay').style.display = 'block';
        if (formType === 'login') {
            document.getElementById('loginForm').style.display = 'block';
        } else if (formType === 'register') {
            document.getElementById('registerForm').style.display = 'block';
        }
    }

    function closeForm() {
        document.getElementById('overlay').style.display = 'none';
        document.getElementById('loginForm').style.display = 'none';
        document.getElementById('registerForm').style.display = 'none';
    }

    document.getElementById('overlay').addEventListener('click', closeForm);

    // Services dropdown
    function toggleDropdown() {
        const dropdown = document.getElementById('dropdown-content');
        dropdown.style.display = dropdown.style.display === 'block' ? 'none' : 'block';
    }

    // Close dropdown if clicked outside
    window.onclick = function (event) {
        if (!event.target.matches('.dropdown a')) {
            const dropdowns = document.getElementsByClassName('dropdown-content');
            for (let i = 0; i < dropdowns.length; i++) {
                dropdowns[i].style.display = 'none';
            }
        }
    }
</script>

</body>
</html>
